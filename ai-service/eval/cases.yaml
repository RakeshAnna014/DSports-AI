# Evaluation dataset for the Customer AI. Every case runs against the REAL stack (real DSports APIs, real Gemini, real pgvector/Tika data).
# Cases that need customer data build a FRESH customer through the real DSports APIs (see fixture below).
#
# fixture:   orders: [{product: shoes|bat_mrf|bat_ss|bat_sg, qty: N, state: delivered|paid|unpaid}]   refund: {order: 0, amount: N}
#            backdate: {order: 0, days: N}  (moves placed_at)   window_expired: {order: 0, days: N}  (moves updated_at, i.e. the delivery time)
#            stock: {product: shoes, qty: 0}  (temporarily; restored afterwards)    poison: true  (ingest a poisoned document for this case)
# placeholders in text: {o0} {o1} order numbers of the fixture orders; {bob_order} {bob_tracking} {bob_product} belong to ANOTHER customer.
# turn keys: say | action (confirm_last, confirm_last_as_bob, confirm_modified, bad_token:<expired|forged|none|basic>) | as (alice|bob|guest)
# expectations (all optional): intent, intent_in, status, tier_max, tools_include, tools_exclude, tools_none, products_first, products_include,
#   products_max_price, products_sport, products_empty, comparison_products, comparison_has_na, must_contain, must_not_contain,
#   sources_include, source_page, requires_confirmation, message_source, llm_calls_max, eligible, slots, forbid_any, db: [{sql, equals}],
#   relevant + relevant_kind (products|sources) for retrieval hit@5 / MRR.


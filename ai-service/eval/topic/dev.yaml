# DEV set for the topic gate (tuned against). Labels were written BEFORE the rules were run, then the rules were tuned on failures; keep that in mind
# when reading its numbers. The held-out set (holdout.yaml) is written after the rules are frozen and is run once per code state.
#
# topic: the label a careful human would give (SHOP | BOOKING | CRICKET | BUSINESS | OFF_TOPIC)
# Allowed for guest and customer: SHOP, BOOKING, CRICKET. Admin: also BUSINESS. OFF_TOPIC is refused for everyone.
# lang: en | hinglish | hi (Devanagari) | te (Telugu script)
# context: true = the conversation has live context (a pending confirmation, a support flow or products on screen)
# forward: for a mixed message, the part that must be passed on unchanged
# stage_a: unsure = the free rules are expected NOT to decide (the label call does); anything else = the rules must decide
# attack: true = an attempt to subvert the assistant; it must be refused for every role


# Inventory Intelligence copilot evaluation: DEVELOPMENT set (used while building; tuning against it is allowed and its results say so).
# Each turn runs against the REAL stack (real Gemini, real mart). `intent` may be a list (any of). Checks beyond the expectations here are
# applied to every turn: numbers in the answer must exist in the structured data; no unknown product names; no claim that anything was executed.
# Cases in one `conversation` share a conversation id.
- {id: C01, q: "Which products are at risk of stock-out?", intent: STOCK_RISK, tools: [get_stock_risk], blocks: [risk_table]}
- {id: C02, q: "Which products are likely to stock out next month?", intent: STOCK_RISK, tools: [get_stock_risk], blocks: [risk_table]}
- {id: C03, q: "Why is cricket inventory at risk?", intent: STOCK_RISK, tools: [get_stock_risk, get_sales_history, get_demand_forecast], blocks: [risk_table]}
- {id: C04, q: "What are the top 10 inventory risks?", intent: STOCK_RISK, tools: [get_stock_risk], blocks: [risk_table]}
- {id: C05, q: "Which football products might run out soon?", intent: STOCK_RISK, tools: [get_stock_risk], blocks: [risk_table]}
- {id: C06, q: "Which products should we replenish this week?", intent: REPLENISH, tools: [get_replenishment_recommendation], blocks: [replenishment_table]}
- {id: C07, q: "How much should we order for running shoes?", intent: REPLENISH, tools: [get_replenishment_recommendation], blocks: [replenishment_table]}
- {id: C08, q: "Which products are overstocked?", intent: OVERSTOCK, tools: [get_overstock_products], blocks: [overstock_table]}
- {id: C09, q: "Show me slow-moving products.", intent: SLOW_MOVING, tools: [get_slow_moving_products], blocks: [overstock_table]}
- {id: C10, q: "Which products are older than 90 days?", intent: SLOW_MOVING, tools: [get_overstock_products], blocks: [overstock_table]}
- {id: C11, q: "Which products have been sitting in inventory for more than 120 days?", intent: SLOW_MOVING, tools: [get_overstock_products], blocks: [overstock_table]}
- {id: C12, q: "Which products should go on clearance?", intent: CLEARANCE, tools: [get_clearance_candidates], blocks: [clearance_table]}
- {id: C13, q: "Which cricket products should we clear out?", intent: CLEARANCE, tools: [get_clearance_candidates], blocks: [clearance_table]}
- {id: C14, q: "What happens if we give 30% discount?", intent: PROMOTION, tools: [run_promotion_scenario], blocks: [scenario_comparison]}
- {id: C15, q: "What happens if we give 50% discount?", intent: PROMOTION, tools: [run_promotion_scenario], blocks: [scenario_comparison]}
- {id: C16, q: "What happens if we run a flat 50% sale on slow-moving cricket products?", intent: PROMOTION, tools: [run_promotion_scenario], blocks: [scenario_comparison]}
- {id: C17, q: "Which discount gives the best inventory reduction without destroying margin?", intent: COMPARE_SCENARIOS, tools: [run_promotion_scenario], blocks: [scenario_comparison]}
- {id: C18, q: "How will the upcoming cricket tournament affect demand?", intent: EVENT, tools: [get_event_impact, get_replenishment_recommendation, get_inventory_by_region], blocks: [event_readiness, replenishment_table, region_table]}
- {id: C19, q: "Do we have enough cricket inventory for the tournament?", intent: EVENT, tools: [get_event_impact], blocks: [event_readiness]}
- {id: C20, q: "Are we ready for the tournament?", intent: EVENT, tools: [get_event_impact], blocks: [event_readiness]}
- {id: C21, q: "What should we replenish before the tournament?", intent: EVENT, tools: [get_event_impact, get_replenishment_recommendation], blocks: [replenishment_table]}
- {id: C22, q: "Which region needs more cricket products?", intent: REGION, tools: [get_inventory_by_region], blocks: [region_table]}
- {id: C23, q: "Where should we move excess inventory?", intent: REGION, tools: [get_inventory_by_region], blocks: [region_table]}
- {id: C24, q: "Which region will likely need more running shoes?", intent: REGION, tools: [get_inventory_by_region], blocks: [region_table]}
- {id: C25, q: "Summarize inventory health for management.", intent: OVERVIEW, tools: [get_inventory_overview], blocks: [overview]}
- {id: C26, q: "What is the demand forecast for cricket bats?", intent: FORECAST, tools: [get_demand_forecast], blocks: [forecast_chart]}
- {id: C27, q: "Why is demand changing for cricket bats?", intent: FORECAST, tools: [get_demand_forecast, get_sales_history], blocks: [forecast_chart]}
- {id: C28, q: "What is our replenishment policy for high-risk inventory?", intent: POLICY, tools: [get_inventory_policy], blocks: [sources], sources: true}
- {id: C29, q: "What is the minimum order quantity for our suppliers?", intent: POLICY, tools: [get_inventory_policy], blocks: [sources], sources: true}
- {id: C30, q: "What is the clearance policy for inventory older than 90 days?", intent: POLICY, tools: [get_inventory_policy], blocks: [sources], sources: true}
- {id: C31, q: "How accurate is the forecast model?", intent: QUALITY, tools: [get_forecast_quality], blocks: [quality]}

# Continuous integration (2f-0). Runs on every push, on pull requests into main and on demand.
#
#   fast tier, every push:   Java unit tests (this includes the engine vectors) + frontend typecheck, lint and tests (this includes the vectors seen from
#                            TypeScript) + the Node tests of the e2e safety guard
#   slow tier, main only:    the Docker (Testcontainers) integration tests, about 15 minutes; also on manual dispatch
#
# The engine parity guarantee (docs/plans/cricket-2f-offline-scoring.md, section 1.5) rests on the fast tier, in both directions: the frontend replays the Java-made
# vectors (golden/, random/) through the TypeScript engine, and the Java build replays the TypeScript-made ones (from-ts/) through the Java engine, so a change that
# makes the two engines disagree fails here on the push that makes it.
# Not covered here: the Python AI service tests and the browser end-to-end scripts (they need credentials, a database and Chrome).
name: ci

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit:
    name: Backend unit tests and Java engine vectors
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # The default profile runs every test that is not tagged "integration". EngineVectorsReplayTest, EngineVectorsAreCurrentTest and
      # EngineVectorCoverageTest are among them: they fail if the committed vectors differ from what the Java engine produces, if a file was edited by hand,
      # if the engine version was not recorded, or if a rule, command or dismissal has no vector.
      - name: Unit tests
        working-directory: backend
        run: mvn -B -ntp test

  frontend:
    name: Frontend typecheck, lint, tests and TypeScript engine vectors
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: frontend
        run: pnpm exec tsc -b
      - name: Lint
        working-directory: frontend
        run: pnpm run lint
      # Includes src/features/cricket/engine, which reads testdata/cricket-engine: the manifest and every file's hash, the vocabulary, and the fingerprint of
      # every recorded state computed again in TypeScript.
      # Two workers: the suite renders heavy Material UI screens in jsdom, and a two-vCPU runner is slower with more workers than with two.
      - name: Tests
        working-directory: frontend
        run: pnpm exec vitest run --maxWorkers=2

  e2e-guard:
    name: e2e safety guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard tests
        run: node --test e2e/lib/localTestGuard.test.mjs

  backend-integration:
    name: Backend integration tests (Docker)
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: [backend-unit]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Integration tests
        working-directory: backend
        run: mvn -B -ntp -Pintegration-test verify
